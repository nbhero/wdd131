<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted</title>
    <link rel="stylesheet" href="./styles/form.css">
    <script src="./scripts/review.js" defer></script>
</head>

<body>

    <div id="reviewCountContainer">
        <header>
            <h1>Review Submitted!</h1>
        </header>

        <main>

            <h2>Thank you for your review.</h2>

            <p>Your review has been successfully submitted.</p>

            <p>
                You have completed
                <strong><span id="reviewCount">0</span></strong>
                reviews.
            </p>

            <h3>Review Details</h3>

            <ul>
                <li><strong>Product:</strong> <span id="product"></span></li>
                <li><strong>Rating:</strong> <span id="rating"></span></li>
                <li><strong>Installation Date:</strong> <span id="installDate"></span></li>
                <li><strong>Name:</strong> <span id="userName"></span></li>
            </ul>

            <p>
                <a href="form.html">Submit Another Review</a>
            </p>

        </main>
    </div>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Bruno Rafael Torres Candido. All rights reserved.
        </p>

        <p>
            Last Modified:
            <span id="lastModified"></span>
        </p>
    </footer>

</body>

</html>
