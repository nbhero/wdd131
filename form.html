<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/form.css">
    <script src="./scripts/form.js"></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <label for="productName">Product Name</label>

            <select id="productName" name="productName" required>
                <option value="" selected disabled>Select a Product ...</option>
                <option value="Product 1">Product 1</option>
                <option value="Product 2">Product 2</option>
                <option value="Product 3">Product 3</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating-group">

                    <div class="rating-option">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">★</label>
                    </div>

                    <div class="rating-option">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <label for="rating2">★★</label>
                    </div>

                    <div class="rating-option">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <label for="rating3">★★★</label>
                    </div>

                    <div class="rating-option">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <label for="rating4">★★★★</label>
                    </div>

                    <div class="rating-option">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <label for="rating5">★★★★★</label>
                    </div>

                </div>
            </fieldset>

            <label for="installDate">Date of Installation</label>

            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>
                    Which features did you find useful in the product?
                    <br>
                    <em>(Check all that apply)</em>
                </legend>

                <div class="checkbox-group">

                    <div class="feature-option">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        <label for="durability">Durability</label>
                    </div>

                    <div class="feature-option">
                        <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                        <label for="easeOfUse">Ease of Use</label>
                    </div>

                    <div class="feature-option">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        <label for="performance">Performance</label>
                    </div>

                    <div class="feature-option">
                        <input type="checkbox" id="design" name="features" value="Design">
                        <label for="design">Design</label>
                    </div>

                </div>
            </fieldset>

            <label for="review">
                Written Review (Optional)
            </label>

            <textarea id="review" name="review" rows="6"></textarea>

            <label for="userName">
                Your Name (Optional)
            </label>

            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">

        </form>

    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Bruno Rafael Torres Candido. All rights reserved.</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
